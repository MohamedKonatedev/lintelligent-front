# Exemple Nginx — Ubuntu 24.04 / VPS LWS
# Placer dans /etc/nginx/sites-available/ puis activer le site.

# Redirection www → apex (308)
server {
    listen 80;
    listen [::]:80;
    server_name www.lintelligent.tv;
    return 308 https://lintelligent.tv$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lintelligent.tv;

    # Certificats Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/lintelligent.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lintelligent.tv/privkey.pem;

    return 308 https://lintelligent.tv$request_uri;
}

# Site canonique
server {
    listen 80;
    listen [::]:80;
    server_name lintelligent.tv;
    return 301 https://lintelligent.tv$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lintelligent.tv;

    ssl_certificate     /etc/letsencrypt/live/lintelligent.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lintelligent.tv/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

